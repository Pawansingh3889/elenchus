# Deployment compose. Not a development file: see docker-compose.yml for that.
#
# The development file is correct for development and wrong for an install. It
# bind-mounts the source over the image, runs uvicorn --reload, seeds demo users on
# every boot, publishes Postgres to the host, and pins images by mutable tags. Every
# one of those is a bug in a deployment, so this is a separate file rather than a pile
# of overrides.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# READ THIS FIRST. Authentication is still the development shim: app/auth resolves the
# caller from an `X-User-Id` header, with nothing to stop a client sending any user's
# id. Anyone who can reach this stack can read and edit every author's surveys. That
# is fine on a private network behind something that does the authenticating, and it
# is not fit for the public internet. This file exists so the rest of a deployment is
# right, not because the service is ready to face the world.
#
# Required in the environment (no defaults, because a missing value must fail loudly):
#   POSTGRES_PASSWORD    the database password
#   FRONTEND_ORIGIN      the browser app's origin, for CORS
#   NEXT_PUBLIC_API_URL  the backend's public origin, baked into the browser bundle
#   LLM_TIER1_API_KEY    unless tier 1 is disabled. The tier defaults to enabled with
#                        the OpenAI base URL and model below, so key + password +
#                        origins is a complete deployment; a tier enabled with an empty
#                        model would fail the whole chain at startup, booting green
#                        while 503ing every model call, which is why the model carries
#                        a real default rather than an empty one.
#
# APP_ENV is set to prod below, and it now changes behaviour rather than only recording
# intent: app.main does not mount the user-list route outside development. That route
# backs the dev-auth picker, and under the shim a user's id is their credential, so
# publishing every id is publishing every credential. Here nobody is seeded and there is
# no picker, so the endpoint has no use that is not an attacker's.

name: elenchus-prod

services:
  postgres:
    # Pinned by digest, not by tag. `postgres:17-alpine` moves, so a tag pin means two
    # installs a month apart can run different engines while claiming the same version.
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elenchus}
      # `:?` fails the command rather than defaulting. A deployment that silently
      # accepts a well-known password is worse than one that refuses to start.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD before deploying}
      POSTGRES_DB: ${POSTGRES_DB:-elenchus}
    # No `ports:`. The database is reachable only on the compose network, by the
    # backend. Publishing 5432 to the host, as the development file does, puts the
    # database on the deployment's network interface for no benefit.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-elenchus} -d ${POSTGRES_DB:-elenchus}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    # Tagged so the built image is identifiable and can be pushed to a registry. A
    # release should pull a pre-built image rather than building on the host; until
    # that registry exists, this at least stops the image being anonymous.
    image: elenchus-backend:0.1.0
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-elenchus}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD before deploying}@postgres:5432/${POSTGRES_DB:-elenchus}
      APP_ENV: prod
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN to the browser app's origin}
      # Empty by default, so a deployment that says nothing has no administrators rather
      # than an accidental one. Granting it is a deliberate line in the environment.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Sized for the break-time burst; see config.py. Forwarded so overrides land.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_MAX_OVERFLOW: ${DB_POOL_MAX_OVERFLOW:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_TIER1_ENABLED: ${LLM_TIER1_ENABLED:-true}
      LLM_TIER1_BASE_URL: ${LLM_TIER1_BASE_URL:-https://api.openai.com/v1}
      LLM_TIER1_API_KEY: ${LLM_TIER1_API_KEY:-}
      # A real default, not an empty one: enabled-with-no-model fails the whole LLM
      # chain at startup while every healthcheck stays green. With base URL, model and
      # the required key all present, the minimal deployment actually serves.
      LLM_TIER1_MODEL: ${LLM_TIER1_MODEL:-gpt-4o-mini}
      LLM_TIER1_TIMEOUT_SECONDS: ${LLM_TIER1_TIMEOUT_SECONDS:-120}
      LLM_TIER1_PROMPT_CACHE: ${LLM_TIER1_PROMPT_CACHE:-false}
      # Tiers 2 and 3 are the failover, and they carry real default models for the same
      # reason tier 1 does: enabling one is then a key plus a boolean, rather than a
      # boolean that boots green and 503s because the model string is empty.
      LLM_TIER2_ENABLED: ${LLM_TIER2_ENABLED:-false}
      LLM_TIER2_BASE_URL: ${LLM_TIER2_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_TIER2_API_KEY: ${LLM_TIER2_API_KEY:-}
      LLM_TIER2_MODEL: ${LLM_TIER2_MODEL:-llama-3.3-70b-versatile}
      LLM_TIER2_TIMEOUT_SECONDS: ${LLM_TIER2_TIMEOUT_SECONDS:-120}
      LLM_TIER2_PROMPT_CACHE: ${LLM_TIER2_PROMPT_CACHE:-false}
      LLM_TIER3_ENABLED: ${LLM_TIER3_ENABLED:-false}
      LLM_TIER3_BASE_URL: ${LLM_TIER3_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_TIER3_API_KEY: ${LLM_TIER3_API_KEY:-}
      LLM_TIER3_MODEL: ${LLM_TIER3_MODEL:-openrouter/free}
      LLM_TIER3_TIMEOUT_SECONDS: ${LLM_TIER3_TIMEOUT_SECONDS:-120}
      LLM_TIER3_PROMPT_CACHE: ${LLM_TIER3_PROMPT_CACHE:-false}
      # Tier 4 is unconfigured and off. It ran a local Ollama here until 8 Aug 2026;
      # the slot survives so any OpenAI-compatible server can take it from .env alone.
      LLM_TIER4_ENABLED: ${LLM_TIER4_ENABLED:-false}
      LLM_TIER4_BASE_URL: ${LLM_TIER4_BASE_URL:-}
      LLM_TIER4_API_KEY: ${LLM_TIER4_API_KEY:-}
      LLM_TIER4_MODEL: ${LLM_TIER4_MODEL:-}
      LLM_TIER4_TIMEOUT_SECONDS: ${LLM_TIER4_TIMEOUT_SECONDS:-300}
      LLM_TIER4_PROMPT_CACHE: ${LLM_TIER4_PROMPT_CACHE:-false}
      # What each tier costs, for the spend ledger. Forwarded for the same reason the
      # connection settings above are: compose reads .env only to interpolate ${...}
      # here, so a variable not named on this list never reaches the container. Left
      # off, prices fall back to the code defaults of zero, and a deployment billing
      # real money to a real provider records every call as free. That is the failure
      # the ledger exists to prevent, and it cannot be corrected afterwards, since
      # prices are applied at call time rather than recomputed from the file.
      #
      # The prices stay 0 by default rather than carrying a figure for the default
      # tier-1 model: a rate hard-coded here goes stale silently, whereas an unpriced
      # hosted tier logs "no price configured" on the first call and counts every one of
      # them in llm_unmetered_calls, so the gap is visible in the rollup.
      LLM_TIER1_PARAMS_B: ${LLM_TIER1_PARAMS_B:-0}
      LLM_TIER1_LOCAL: ${LLM_TIER1_LOCAL:-false}
      LLM_TIER1_PRICE_IN_PER_MTOK: ${LLM_TIER1_PRICE_IN_PER_MTOK:-0}
      LLM_TIER1_PRICE_OUT_PER_MTOK: ${LLM_TIER1_PRICE_OUT_PER_MTOK:-0}
      LLM_TIER2_PARAMS_B: ${LLM_TIER2_PARAMS_B:-0}
      LLM_TIER2_LOCAL: ${LLM_TIER2_LOCAL:-false}
      LLM_TIER2_PRICE_IN_PER_MTOK: ${LLM_TIER2_PRICE_IN_PER_MTOK:-0}
      LLM_TIER2_PRICE_OUT_PER_MTOK: ${LLM_TIER2_PRICE_OUT_PER_MTOK:-0}
      LLM_TIER3_PARAMS_B: ${LLM_TIER3_PARAMS_B:-0}
      LLM_TIER3_LOCAL: ${LLM_TIER3_LOCAL:-false}
      LLM_TIER3_PRICE_IN_PER_MTOK: ${LLM_TIER3_PRICE_IN_PER_MTOK:-0}
      LLM_TIER3_PRICE_OUT_PER_MTOK: ${LLM_TIER3_PRICE_OUT_PER_MTOK:-0}
      # Tier 4 defaults to a hosted pricing shape because the slot is empty. If you fill
      # it with a locally served model, set LLM_TIER4_LOCAL=true and a real PARAMS_B:
      # a local tier bills no tokens but costs the machine for as long as it runs, so it
      # is priced from wall clock instead, and reporting it as free is the one number
      # that is certainly wrong.
      LLM_TIER4_PARAMS_B: ${LLM_TIER4_PARAMS_B:-0}
      LLM_TIER4_LOCAL: ${LLM_TIER4_LOCAL:-false}
      LLM_TIER4_PRICE_IN_PER_MTOK: ${LLM_TIER4_PRICE_IN_PER_MTOK:-0}
      LLM_TIER4_PRICE_OUT_PER_MTOK: ${LLM_TIER4_PRICE_OUT_PER_MTOK:-0}
      HARDWARE_WATTS: ${HARDWARE_WATTS:-200}
      ELECTRICITY_PRICE_PER_KWH: ${ELECTRICITY_PRICE_PER_KWH:-0.32}
      LLM_LEDGER_PATH: ${LLM_LEDGER_PATH:-var/llm_ledger.jsonl}
    depends_on:
      postgres:
        condition: service_healthy
    # No source bind mount: the image is what runs, so what was tested is what ships.
    # Migrations still apply on start, because the schema must match the code that
    # ships with it, but `python -m app.seed` does not. Seeding is idempotent, which is
    # why it is harmless in development and exactly why it must not run here: it would
    # leave five working accounts behind, two of them authors.
    #
    # The one volume is the LLM spend ledger (LLM_LEDGER_PATH defaults to
    # var/llm_ledger.jsonl under the app directory). It is an append-only record whose
    # whole point is durability; without the volume every container recreate deleted it.
    volumes:
      - backend-var:/app/var
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    healthcheck:
      # Readiness, not liveness: /api/v1/health answers 503 when it cannot reach the
      # database, so an unhealthy backend here means it genuinely cannot serve.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5).status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    image: elenchus-frontend:0.1.0
    build: ./frontend
    environment:
      # Baked into the browser bundle at build time, so it must be the origin the
      # browser will use, not an in-network hostname the browser cannot resolve.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL to the backend's public origin}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    # `next build` then `next start`, rather than the development file's `next dev`.
    # No bind mount, so the build is of the image's own source.
    command: >-
      sh -c "pnpm build && pnpm start"
    restart: unless-stopped

  # Continuous archiving to object storage. The database ships each write-ahead log
  # segment as it closes, so recovery is to a moment rather than to last night: the
  # difference between losing a shift's answers and losing the ones since 14:32.
  #
  # Empty by default and inert when unset, like every other credential here. A
  # deployment with no repository configured runs exactly as it did, with no backups and
  # nothing pretending otherwise. See docs/BACKUP.md.
  backup:
    image: pgbackrest/pgbackrest:2.55
    profiles: ["backup"]
    environment:
      PGBACKREST_REPO1_TYPE: s3
      PGBACKREST_REPO1_S3_BUCKET: ${BACKUP_S3_BUCKET:?set BACKUP_S3_BUCKET to enable backups}
      PGBACKREST_REPO1_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?set BACKUP_S3_ENDPOINT}
      PGBACKREST_REPO1_S3_KEY: ${BACKUP_S3_KEY:?set BACKUP_S3_KEY}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${BACKUP_S3_KEY_SECRET:?set BACKUP_S3_KEY_SECRET}
      PGBACKREST_REPO1_S3_REGION: ${BACKUP_S3_REGION:-auto}
      PGBACKREST_REPO1_PATH: /elenchus
      # Encrypted in the repository, so the bucket holding it is not also a copy of every
      # answer in plain text. The passphrase is not recoverable from the backup: lose it
      # and the backups are noise.
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS:?set BACKUP_CIPHER_PASS}
      # A guess until the plant's own record-retention standard replaces it: BRCGS ties
      # retention to shelf life plus customer requirements, and this file should not
      # invent that number.
      PGBACKREST_REPO1_RETENTION_FULL: ${BACKUP_RETENTION_FULL:-12}
      PGBACKREST_PG1_HOST: postgres
      PGBACKREST_PG1_PATH: /var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  # The append-only LLM spend ledger, which must outlive the container it is written in.
  backend-var:
