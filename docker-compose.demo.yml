# Self-contained demo stack. Sits between dev (bind-mounts, reload) and prod (no seed,
# no picker). Seeds on every boot, mounts the dev user picker, and exposes the reset
# endpoint. For public demos where seed data must be accessible.
#
#   docker compose -f docker-compose.demo.yml up -d
#
# Required in the environment:
#   LLM_TIER1_API_KEY    at least one LLM tier for the conversational conducting
#
# Everything else has sensible defaults for a demo.

name: elenchus-demo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elenchus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elenchus}
      POSTGRES_DB: ${POSTGRES_DB:-elenchus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-elenchus} -d ${POSTGRES_DB:-elenchus}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-elenchus}:${POSTGRES_PASSWORD:-elenchus}@postgres:5432/${POSTGRES_DB:-elenchus}
      APP_ENV: demo
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_MAX_OVERFLOW: ${DB_POOL_MAX_OVERFLOW:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_TIER1_ENABLED: ${LLM_TIER1_ENABLED:-true}
      LLM_TIER1_BASE_URL: ${LLM_TIER1_BASE_URL:-https://api.openai.com/v1}
      LLM_TIER1_API_KEY: ${LLM_TIER1_API_KEY:-}
      LLM_TIER1_MODEL: ${LLM_TIER1_MODEL:-gpt-4o-mini}
      LLM_TIER1_TIMEOUT_SECONDS: ${LLM_TIER1_TIMEOUT_SECONDS:-120}
      LLM_TIER1_PROMPT_CACHE: ${LLM_TIER1_PROMPT_CACHE:-false}
      LLM_TIER1_MAX_COMPLETION_TOKENS: ${LLM_TIER1_MAX_COMPLETION_TOKENS:-4096}
      LLM_TIER2_ENABLED: ${LLM_TIER2_ENABLED:-false}
      LLM_TIER2_BASE_URL: ${LLM_TIER2_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_TIER2_API_KEY: ${LLM_TIER2_API_KEY:-}
      LLM_TIER2_MODEL: ${LLM_TIER2_MODEL:-llama-3.3-70b-versatile}
      LLM_TIER2_TIMEOUT_SECONDS: ${LLM_TIER2_TIMEOUT_SECONDS:-120}
      LLM_TIER2_PROMPT_CACHE: ${LLM_TIER2_PROMPT_CACHE:-false}
      LLM_TIER2_MAX_COMPLETION_TOKENS: ${LLM_TIER2_MAX_COMPLETION_TOKENS:-4096}
      LLM_TIER3_ENABLED: ${LLM_TIER3_ENABLED:-false}
      LLM_TIER3_BASE_URL: ${LLM_TIER3_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_TIER3_API_KEY: ${LLM_TIER3_API_KEY:-}
      LLM_TIER3_MODEL: ${LLM_TIER3_MODEL:-openrouter/free}
      LLM_TIER3_TIMEOUT_SECONDS: ${LLM_TIER3_TIMEOUT_SECONDS:-120}
      LLM_TIER3_PROMPT_CACHE: ${LLM_TIER3_PROMPT_CACHE:-false}
      LLM_TIER3_MAX_COMPLETION_TOKENS: ${LLM_TIER3_MAX_COMPLETION_TOKENS:-1024}
      LLM_TIER4_ENABLED: ${LLM_TIER4_ENABLED:-false}
      LLM_TIER4_BASE_URL: ${LLM_TIER4_BASE_URL:-}
      LLM_TIER4_API_KEY: ${LLM_TIER4_API_KEY:-}
      LLM_TIER4_MODEL: ${LLM_TIER4_MODEL:-}
      LLM_TIER4_TIMEOUT_SECONDS: ${LLM_TIER4_TIMEOUT_SECONDS:-300}
      LLM_TIER4_PROMPT_CACHE: ${LLM_TIER4_PROMPT_CACHE:-false}
      LLM_TIER4_MAX_COMPLETION_TOKENS: ${LLM_TIER4_MAX_COMPLETION_TOKENS:-1024}
      LLM_TIER1_PARAMS_B: ${LLM_TIER1_PARAMS_B:-0}
      LLM_TIER1_LOCAL: ${LLM_TIER1_LOCAL:-false}
      LLM_TIER1_PRICE_IN_PER_MTOK: ${LLM_TIER1_PRICE_IN_PER_MTOK:-}
      LLM_TIER1_PRICE_OUT_PER_MTOK: ${LLM_TIER1_PRICE_OUT_PER_MTOK:-}
      LLM_TIER1_PRICE_CACHED_IN_PER_MTOK: ${LLM_TIER1_PRICE_CACHED_IN_PER_MTOK:-}
      LLM_TIER2_PARAMS_B: ${LLM_TIER2_PARAMS_B:-0}
      LLM_TIER2_LOCAL: ${LLM_TIER2_LOCAL:-false}
      LLM_TIER2_PRICE_IN_PER_MTOK: ${LLM_TIER2_PRICE_IN_PER_MTOK:-}
      LLM_TIER2_PRICE_OUT_PER_MTOK: ${LLM_TIER2_PRICE_OUT_PER_MTOK:-}
      LLM_TIER2_PRICE_CACHED_IN_PER_MTOK: ${LLM_TIER2_PRICE_CACHED_IN_PER_MTOK:-}
      LLM_TIER3_PARAMS_B: ${LLM_TIER3_PARAMS_B:-0}
      LLM_TIER3_LOCAL: ${LLM_TIER3_LOCAL:-false}
      LLM_TIER3_PRICE_IN_PER_MTOK: ${LLM_TIER3_PRICE_IN_PER_MTOK:-}
      LLM_TIER3_PRICE_OUT_PER_MTOK: ${LLM_TIER3_PRICE_OUT_PER_MTOK:-}
      LLM_TIER3_PRICE_CACHED_IN_PER_MTOK: ${LLM_TIER3_PRICE_CACHED_IN_PER_MTOK:-}
      LLM_TIER4_PARAMS_B: ${LLM_TIER4_PARAMS_B:-0}
      LLM_TIER4_LOCAL: ${LLM_TIER4_LOCAL:-false}
      LLM_TIER4_PRICE_IN_PER_MTOK: ${LLM_TIER4_PRICE_IN_PER_MTOK:-}
      LLM_TIER4_PRICE_OUT_PER_MTOK: ${LLM_TIER4_PRICE_OUT_PER_MTOK:-}
      LLM_TIER4_PRICE_CACHED_IN_PER_MTOK: ${LLM_TIER4_PRICE_CACHED_IN_PER_MTOK:-}
      # Embeddings and semantic grounding. Price and margin have no default on purpose.
      LLM_EMBEDDING_ENABLED: ${LLM_EMBEDDING_ENABLED:-false}
      LLM_EMBEDDING_BASE_URL: ${LLM_EMBEDDING_BASE_URL:-}
      LLM_EMBEDDING_API_KEY: ${LLM_EMBEDDING_API_KEY:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_EMBEDDING_TIMEOUT_SECONDS: ${LLM_EMBEDDING_TIMEOUT_SECONDS:-30}
      LLM_EMBEDDING_PRICE_PER_MTOK: ${LLM_EMBEDDING_PRICE_PER_MTOK:-}
      GROUNDING_SEMANTIC_ENABLED: ${GROUNDING_SEMANTIC_ENABLED:-false}
      GROUNDING_SIMILARITY_MARGIN: ${GROUNDING_SIMILARITY_MARGIN:-}
      # The interpretability service runs on the host, not in the stack (see interp/).
      INTERP_ENABLED: ${INTERP_ENABLED:-false}
      INTERP_BASE_URL: ${INTERP_BASE_URL:-}
      INTERP_TOKEN: ${INTERP_TOKEN:-}
      INTERP_TIMEOUT_SECONDS: ${INTERP_TIMEOUT_SECONDS:-900}
      INTERP_PARAMS_B: ${INTERP_PARAMS_B:-0.6}
      HARDWARE_WATTS: ${HARDWARE_WATTS:-200}
      ELECTRICITY_PRICE_PER_KWH: ${ELECTRICITY_PRICE_PER_KWH:-0.32}
      LLM_LEDGER_PATH: ${LLM_LEDGER_PATH:-var/llm_ledger.jsonl}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend-var:/app/var
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # Migrations + seed on startup. The seed is idempotent, so re-running is safe.
    command: >-
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5).status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_ENV: demo
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    command: >-
      sh -c "pnpm build && pnpm start"
    restart: unless-stopped

volumes:
  pgdata:
  backend-var:
