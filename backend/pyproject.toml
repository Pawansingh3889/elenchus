[project]
name = "elenchus-survey-backend"
version = "0.1.0"
description = "Elenchus survey service backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    # The only HTTP client in the app: every LLM tier is reached through it, so it is a
    # first-class runtime dependency rather than something inherited from an SDK.
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "import-linter>=2.13",
    "pytest-cov>=7.1.0",
    # Reads the compose files, to assert every setting the app needs is forwarded to
    # the container. Available transitively through uvicorn[standard] already; declared
    # because a test that imports it should not depend on another package's extras.
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# Keep `class X(str, enum.Enum)` — explicit and behaves identically with SQLAlchemy.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# "scripts" alongside the package, so the suite can import the engine invariants the
# live harness shares (scripts/conduct_invariants.py). CI already exports the same path
# for the guard step, so this makes the two agree rather than adding a new idea.
pythonpath = [".", "scripts"]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Executable architecture. CLAUDE.md and ARCHITECTURE.md state these rules in
# prose; import-linter is what makes them true. A layering rule that lives only
# in a document is a rule the next commit can break without anyone noticing.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered inside every domain"
type = "layers"
layers = ["router", "(service)", "repository", "(models)"]
containers = ["app.templates", "app.runs", "app.conduct", "app.users"]
comment = """
Imports point downward only: router -> service -> repository -> models. The
contract resolves the real import graph, so an aliased import, a re-export or a
chain through a third module all fail it.

service and models are parenthesised because they are optional, not because
they are less binding: app.conduct puts its logic in engine.py and reads the
run models from app.runs. A layer that is absent is skipped; a layer that
exists is ordered. app.users had no service until the admin path needed one,
which is the case the parentheses were there for.
"""

[[tool.importlinter.contracts]]
name = "One module owns the HTTP calls"
type = "forbidden"
source_modules = [
    "app.llm.client",
    "app.llm.factory",
    "app.llm.failover",
    "app.conduct.engine",
    "app.runs.summary",
    "app.templates.generation",
]
forbidden_modules = ["httpx", "urllib", "socket", "requests"]
allow_indirect_imports = "true"
comment = """
"One LLM client module owns the HTTP calls, timeouts, and token logging"
(CLAUDE.md). app.llm.openai_compatible is that module and is deliberately not
in this list. client.py holds the contract and must stay free of transport, so
that swapping providers is one module's problem; the engines above it reach a
provider only through LLMProtocol.

Direct imports only. Reaching a socket through the factory is the design: the
factory's whole job is to build the client that owns the transport. What this
forbids is a module opening its own connection beside it.
"""
