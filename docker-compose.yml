name: elenchus

# Load environment variables from .env file for docker-compose
env_file:
  - .env

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elenchus
      POSTGRES_PASSWORD: elenchus
      POSTGRES_DB: elenchus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elenchus -d elenchus"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://elenchus:elenchus@postgres:5432/elenchus
      # Who is an administrator, passed through explicitly like everything else here.
      # Without this line the container never sees the allowlist and admin is silently
      # never granted: the setting would appear to work on the host, where the backend
      # is started with --env-file, and do nothing at all in the stack.
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      # Break-time is a burst: a shift answers at once, each conversation holding a
      # connection across its LLM call. Defaults in config.py are sized for it; these
      # are forwarded so an operator's override actually reaches the container.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_MAX_OVERFLOW: ${DB_POOL_MAX_OVERFLOW:-30}
      # Real sign-in, forwarded for exactly the reason the allowlist above is: compose
      # reads .env only to interpolate ${...} here, so a variable not named on this list
      # never reaches the container. Unset means the provider is simply not offered, and
      # the development email box remains the way in.
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_TENANT: ${OAUTH_MICROSOFT_TENANT:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      # The OpenAI-compatible LLM tiers, tried in order (see .env.example). Passed
      # through explicitly: without these the container never sees the settings and the
      # chain silently can't engage.
      LLM_TIER1_ENABLED: ${LLM_TIER1_ENABLED:-false}
      LLM_TIER1_BASE_URL: ${LLM_TIER1_BASE_URL:-}
      LLM_TIER1_API_KEY: ${LLM_TIER1_API_KEY:-}
      LLM_TIER1_MODEL: ${LLM_TIER1_MODEL:-}
      LLM_TIER1_TIMEOUT_SECONDS: ${LLM_TIER1_TIMEOUT_SECONDS:-120}
      LLM_TIER1_PROMPT_CACHE: ${LLM_TIER1_PROMPT_CACHE:-false}
      LLM_TIER1_MAX_COMPLETION_TOKENS: ${LLM_TIER1_MAX_COMPLETION_TOKENS:-4096}
      LLM_TIER2_ENABLED: ${LLM_TIER2_ENABLED:-false}
      LLM_TIER2_BASE_URL: ${LLM_TIER2_BASE_URL:-}
      LLM_TIER2_API_KEY: ${LLM_TIER2_API_KEY:-}
      LLM_TIER2_MODEL: ${LLM_TIER2_MODEL:-}
      LLM_TIER2_TIMEOUT_SECONDS: ${LLM_TIER2_TIMEOUT_SECONDS:-120}
      LLM_TIER2_PROMPT_CACHE: ${LLM_TIER2_PROMPT_CACHE:-false}
      LLM_TIER2_MAX_COMPLETION_TOKENS: ${LLM_TIER2_MAX_COMPLETION_TOKENS:-4096}
      LLM_TIER3_ENABLED: ${LLM_TIER3_ENABLED:-false}
      LLM_TIER3_BASE_URL: ${LLM_TIER3_BASE_URL:-}
      LLM_TIER3_API_KEY: ${LLM_TIER3_API_KEY:-}
      LLM_TIER3_MODEL: ${LLM_TIER3_MODEL:-}
      LLM_TIER3_TIMEOUT_SECONDS: ${LLM_TIER3_TIMEOUT_SECONDS:-120}
      LLM_TIER3_PROMPT_CACHE: ${LLM_TIER3_PROMPT_CACHE:-false}
      LLM_TIER3_MAX_COMPLETION_TOKENS: ${LLM_TIER3_MAX_COMPLETION_TOKENS:-1024}
      # Tier 4 is unconfigured and off. It used to run a local Ollama in this file;
      # that is gone, but the tier itself remains because it costs nothing to keep and
      # any OpenAI-compatible server can take the slot by setting these four in .env.
      # The timeout stays generous because whatever lands here is likely to be local
      # and paying a cold model load on the first call.
      LLM_TIER4_ENABLED: ${LLM_TIER4_ENABLED:-false}
      LLM_TIER4_BASE_URL: ${LLM_TIER4_BASE_URL:-}
      LLM_TIER4_API_KEY: ${LLM_TIER4_API_KEY:-}
      LLM_TIER4_MODEL: ${LLM_TIER4_MODEL:-}
      LLM_TIER4_TIMEOUT_SECONDS: ${LLM_TIER4_TIMEOUT_SECONDS:-300}
      LLM_TIER4_PROMPT_CACHE: ${LLM_TIER4_PROMPT_CACHE:-false}
      LLM_TIER4_MAX_COMPLETION_TOKENS: ${LLM_TIER4_MAX_COMPLETION_TOKENS:-1024}
      # What each tier costs, for the spend ledger. Forwarded for the same reason the
      # connection settings above are: compose reads the root .env only to interpolate
      # ${...} here, so a variable that is not named on this list never reaches the
      # container. A price nobody set arrives empty, which settings read as unstated:
      # an enabled hosted tier then refuses to start. It used to default to 0 here,
      # which recorded every hosted call as free and could not be corrected later,
      # because the ledger prices at call time rather than recomputing.
      LLM_TIER1_PARAMS_B: ${LLM_TIER1_PARAMS_B:-0}
      LLM_TIER1_LOCAL: ${LLM_TIER1_LOCAL:-false}
      LLM_TIER1_PRICE_IN_PER_MTOK: ${LLM_TIER1_PRICE_IN_PER_MTOK:-}
      LLM_TIER1_PRICE_OUT_PER_MTOK: ${LLM_TIER1_PRICE_OUT_PER_MTOK:-}
      LLM_TIER1_PRICE_CACHED_IN_PER_MTOK: ${LLM_TIER1_PRICE_CACHED_IN_PER_MTOK:-}
      LLM_TIER2_PARAMS_B: ${LLM_TIER2_PARAMS_B:-0}
      LLM_TIER2_LOCAL: ${LLM_TIER2_LOCAL:-false}
      LLM_TIER2_PRICE_IN_PER_MTOK: ${LLM_TIER2_PRICE_IN_PER_MTOK:-}
      LLM_TIER2_PRICE_OUT_PER_MTOK: ${LLM_TIER2_PRICE_OUT_PER_MTOK:-}
      LLM_TIER2_PRICE_CACHED_IN_PER_MTOK: ${LLM_TIER2_PRICE_CACHED_IN_PER_MTOK:-}
      LLM_TIER3_PARAMS_B: ${LLM_TIER3_PARAMS_B:-0}
      LLM_TIER3_LOCAL: ${LLM_TIER3_LOCAL:-false}
      LLM_TIER3_PRICE_IN_PER_MTOK: ${LLM_TIER3_PRICE_IN_PER_MTOK:-}
      LLM_TIER3_PRICE_OUT_PER_MTOK: ${LLM_TIER3_PRICE_OUT_PER_MTOK:-}
      LLM_TIER3_PRICE_CACHED_IN_PER_MTOK: ${LLM_TIER3_PRICE_CACHED_IN_PER_MTOK:-}
      # Tier 4 defaults to a hosted pricing shape because the slot is empty. Point it at
      # a model you serve yourself and set LLM_TIER4_LOCAL=true with a real PARAMS_B:
      # a local tier bills no tokens and is priced from wall clock instead, and reporting
      # it as free is the one number that is certainly wrong.
      LLM_TIER4_PARAMS_B: ${LLM_TIER4_PARAMS_B:-0}
      LLM_TIER4_LOCAL: ${LLM_TIER4_LOCAL:-false}
      LLM_TIER4_PRICE_IN_PER_MTOK: ${LLM_TIER4_PRICE_IN_PER_MTOK:-}
      LLM_TIER4_PRICE_OUT_PER_MTOK: ${LLM_TIER4_PRICE_OUT_PER_MTOK:-}
      LLM_TIER4_PRICE_CACHED_IN_PER_MTOK: ${LLM_TIER4_PRICE_CACHED_IN_PER_MTOK:-}
      HARDWARE_WATTS: ${HARDWARE_WATTS:-200}
      ELECTRICITY_PRICE_PER_KWH: ${ELECTRICITY_PRICE_PER_KWH:-0.32}
      LLM_LEDGER_PATH: ${LLM_LEDGER_PATH:-var/llm_ledger.jsonl}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # ":z" relabels the bind mount for SELinux (Fedora/RHEL + rootless Podman);
      # it is a no-op on Docker and on systems without SELinux.
      - ./backend:/app:z
      - /app/.venv
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
      CI: "true"
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      # ":z" relabels the bind mount for SELinux (Fedora/RHEL + rootless Podman);
      # it is a no-op on Docker and on systems without SELinux.
      - ./frontend:/app:z
    command: ["pnpm", "dev"]

volumes:
  pgdata:
