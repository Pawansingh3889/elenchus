name: elenchus

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elenchus
      POSTGRES_PASSWORD: elenchus
      POSTGRES_DB: elenchus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elenchus -d elenchus"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tier 4 of the LLM chain: the local backstop, reached only when all three cloud
  # tiers fail. It is never rate-limited and never out of credit, which is the point.
  ollama:
    image: docker.io/ollama/ollama:latest
    environment:
      # Ollama unloads a model after ~5 minutes idle by default, so the first turn
      # after any gap pays a full cold load. On CPU that is minutes, and it is the
      # only reason tier 4's timeout is 300s. Keeping the model resident pays that
      # cost once at startup instead of once per idle gap.
      #
      # This is the server-side lever. Passing `keep_alive` as a request field works
      # on Ollama's native /api/chat but is not reliably honoured by the /v1 OpenAI
      # shim this app speaks, so it is set here where it unambiguously applies.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      # Not just "is the server up": the model must actually be present, or tier 4
      # 404s at precisely the moment all three cloud tiers have already failed.
      test:
        [
          "CMD-SHELL",
          "ollama list | grep -q \"${OLLAMA_MODEL:-llama3.2:3b}\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 60          # generous: the first pull downloads several GB
      start_period: 30s

  # Pulls the model once, then exits. Deliberately NOT in the backend's depends_on:
  # gating the API on a multi-gigabyte download put the model on the critical path of
  # every `compose up`, and a developer offline or on hotel wifi could not reach the
  # template CRUD, which needs no model at all. Until the pull lands, tier-4 calls fail
  # and surface as llm_unavailable, which is the honest state of the system. The pull
  # is also skipped when the volume already holds the model, so an offline restart
  # with cached weights comes up clean instead of dying on the fetch.
  ollama-pull:
    image: docker.io/ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      'until ollama list >/dev/null 2>&1; do sleep 2; done;
       ollama list | grep -q "${OLLAMA_MODEL:-llama3.2:3b}" ||
       ollama pull "${OLLAMA_MODEL:-llama3.2:3b}"'
    restart: "no"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://elenchus:elenchus@postgres:5432/elenchus
      # The OpenAI-compatible LLM tiers, tried in order (see .env.example). Passed
      # through explicitly: without these the container never sees the settings and the
      # chain silently can't engage.
      LLM_TIER1_ENABLED: ${LLM_TIER1_ENABLED:-false}
      LLM_TIER1_BASE_URL: ${LLM_TIER1_BASE_URL:-}
      LLM_TIER1_API_KEY: ${LLM_TIER1_API_KEY:-}
      LLM_TIER1_MODEL: ${LLM_TIER1_MODEL:-}
      LLM_TIER1_TIMEOUT_SECONDS: ${LLM_TIER1_TIMEOUT_SECONDS:-120}
      LLM_TIER2_ENABLED: ${LLM_TIER2_ENABLED:-false}
      LLM_TIER2_BASE_URL: ${LLM_TIER2_BASE_URL:-}
      LLM_TIER2_API_KEY: ${LLM_TIER2_API_KEY:-}
      LLM_TIER2_MODEL: ${LLM_TIER2_MODEL:-}
      LLM_TIER2_TIMEOUT_SECONDS: ${LLM_TIER2_TIMEOUT_SECONDS:-120}
      LLM_TIER3_ENABLED: ${LLM_TIER3_ENABLED:-false}
      LLM_TIER3_BASE_URL: ${LLM_TIER3_BASE_URL:-}
      LLM_TIER3_API_KEY: ${LLM_TIER3_API_KEY:-}
      LLM_TIER3_MODEL: ${LLM_TIER3_MODEL:-}
      LLM_TIER3_TIMEOUT_SECONDS: ${LLM_TIER3_TIMEOUT_SECONDS:-120}
      # Tier 4 defaults point at the in-network Ollama service above, so the local
      # backstop works out of the box without anything in .env.
      LLM_TIER4_ENABLED: ${LLM_TIER4_ENABLED:-true}
      LLM_TIER4_BASE_URL: ${LLM_TIER4_BASE_URL:-http://ollama:11434/v1}
      LLM_TIER4_API_KEY: ${LLM_TIER4_API_KEY:-}
      LLM_TIER4_MODEL: ${LLM_TIER4_MODEL:-llama3.2:3b}
      LLM_TIER4_TIMEOUT_SECONDS: ${LLM_TIER4_TIMEOUT_SECONDS:-300}
      # What each tier costs, for the spend ledger. Forwarded for the same reason the
      # connection settings above are: compose reads the root .env only to interpolate
      # ${...} here, so a variable that is not named on this list never reaches the
      # container. Left off, prices fall back to the code defaults of zero and every
      # hosted call is recorded as free, which the ledger cannot be told about later
      # because it prices at call time rather than recomputing.
      LLM_TIER1_PARAMS_B: ${LLM_TIER1_PARAMS_B:-0}
      LLM_TIER1_LOCAL: ${LLM_TIER1_LOCAL:-false}
      LLM_TIER1_PRICE_IN_PER_MTOK: ${LLM_TIER1_PRICE_IN_PER_MTOK:-0}
      LLM_TIER1_PRICE_OUT_PER_MTOK: ${LLM_TIER1_PRICE_OUT_PER_MTOK:-0}
      LLM_TIER2_PARAMS_B: ${LLM_TIER2_PARAMS_B:-0}
      LLM_TIER2_LOCAL: ${LLM_TIER2_LOCAL:-false}
      LLM_TIER2_PRICE_IN_PER_MTOK: ${LLM_TIER2_PRICE_IN_PER_MTOK:-0}
      LLM_TIER2_PRICE_OUT_PER_MTOK: ${LLM_TIER2_PRICE_OUT_PER_MTOK:-0}
      LLM_TIER3_PARAMS_B: ${LLM_TIER3_PARAMS_B:-0}
      LLM_TIER3_LOCAL: ${LLM_TIER3_LOCAL:-false}
      LLM_TIER3_PRICE_IN_PER_MTOK: ${LLM_TIER3_PRICE_IN_PER_MTOK:-0}
      LLM_TIER3_PRICE_OUT_PER_MTOK: ${LLM_TIER3_PRICE_OUT_PER_MTOK:-0}
      # Tier 4 is the in-network Ollama: it bills no tokens but costs the machine for as
      # long as it runs, so it is priced from the clock and must stay marked local.
      LLM_TIER4_PARAMS_B: ${LLM_TIER4_PARAMS_B:-3}
      LLM_TIER4_LOCAL: ${LLM_TIER4_LOCAL:-true}
      LLM_TIER4_PRICE_IN_PER_MTOK: ${LLM_TIER4_PRICE_IN_PER_MTOK:-0}
      LLM_TIER4_PRICE_OUT_PER_MTOK: ${LLM_TIER4_PRICE_OUT_PER_MTOK:-0}
      HARDWARE_WATTS: ${HARDWARE_WATTS:-200}
      ELECTRICITY_PRICE_PER_KWH: ${ELECTRICITY_PRICE_PER_KWH:-0.32}
      LLM_LEDGER_PATH: ${LLM_LEDGER_PATH:-var/llm_ledger.jsonl}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # ":z" relabels the bind mount for SELinux (Fedora/RHEL + rootless Podman);
      # it is a no-op on Docker and on systems without SELinux.
      - ./backend:/app:z
      - /app/.venv
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      # ":z" relabels the bind mount for SELinux (Fedora/RHEL + rootless Podman);
      # it is a no-op on Docker and on systems without SELinux.
      - ./frontend:/app:z
      - /app/node_modules
    command: ["pnpm", "dev"]

volumes:
  pgdata:
  # Model weights are several GB; a named volume keeps them across `compose down`
  # so the pull happens once rather than on every restart.
  ollama:
