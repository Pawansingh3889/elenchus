name: elenchus

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elenchus
      POSTGRES_PASSWORD: elenchus
      POSTGRES_DB: elenchus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elenchus -d elenchus"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://elenchus:elenchus@postgres:5432/elenchus
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      # Optional OpenAI-compatible backup LLMs forming a failover chain after Anthropic
      # (see .env.example). Without these the container never sees the backup settings and
      # failover silently can't engage.
      LLM_BACKUP_ENABLED: ${LLM_BACKUP_ENABLED:-false}
      LLM_BACKUP_BASE_URL: ${LLM_BACKUP_BASE_URL:-}
      LLM_BACKUP_API_KEY: ${LLM_BACKUP_API_KEY:-}
      LLM_BACKUP_MODEL: ${LLM_BACKUP_MODEL:-}
      LLM_BACKUP_TIMEOUT_SECONDS: ${LLM_BACKUP_TIMEOUT_SECONDS:-120}
      LLM_BACKUP2_ENABLED: ${LLM_BACKUP2_ENABLED:-false}
      LLM_BACKUP2_BASE_URL: ${LLM_BACKUP2_BASE_URL:-}
      LLM_BACKUP2_API_KEY: ${LLM_BACKUP2_API_KEY:-}
      LLM_BACKUP2_MODEL: ${LLM_BACKUP2_MODEL:-}
      LLM_BACKUP2_TIMEOUT_SECONDS: ${LLM_BACKUP2_TIMEOUT_SECONDS:-120}
      LLM_BACKUP3_ENABLED: ${LLM_BACKUP3_ENABLED:-false}
      LLM_BACKUP3_BASE_URL: ${LLM_BACKUP3_BASE_URL:-}
      LLM_BACKUP3_API_KEY: ${LLM_BACKUP3_API_KEY:-}
      LLM_BACKUP3_MODEL: ${LLM_BACKUP3_MODEL:-}
      LLM_BACKUP3_TIMEOUT_SECONDS: ${LLM_BACKUP3_TIMEOUT_SECONDS:-120}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # ":z" relabels the bind mount for SELinux (Fedora/RHEL + rootless Podman);
      # it is a no-op on Docker and on systems without SELinux.
      - ./backend:/app:z
      - /app/.venv
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      # ":z" relabels the bind mount for SELinux (Fedora/RHEL + rootless Podman);
      # it is a no-op on Docker and on systems without SELinux.
      - ./frontend:/app:z
      - /app/node_modules
    command: ["pnpm", "dev"]

volumes:
  pgdata:
