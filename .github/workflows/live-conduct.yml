name: Live conduct check

# The CI workflow runs the mocked suite on every push and never needs a key.
# This one is the opposite: it drives real conversations through the real model,
# which costs credit. It is the check that has found every fabrication bug the
# mocked tests could not - a fake LLM does what the test tells it to and never
# tries to work around the engine's design.
#
# It runs two ways, and the difference is scope, not kind:
#
#   by hand      "Run workflow" (Actions tab, or the GitHub Actions panel in
#                VS Code). Pick any scenario, or all of them, ~150 model calls.
#   on a PR      automatically, but only when the pull request touches the code
#                that decides how a conversation goes: the conduct engine, the
#                answer gate, or the prompts. Two scenarios, one scripted and one
#                prompt-generated, for about a tenth of the calls. The generate
#                shape crash that blocked both prompt-generated scenarios sat in
#                main unnoticed precisely because nothing ran this on a change.
#
# Every run also audits itself: a second model pass reads each finished transcript
# and asks whether the respondent really supplied each recorded answer. Those
# verdicts print but never fail the build, because a judge is a model and a red
# that turns on judgement gets ignored. Read them; they are where the next
# invented answer shows up first.
#
# Setup once: repo Settings -> Secrets and variables -> Actions -> New repository
# secret, name LLM_TIER1_API_KEY, holding a key for the tier-1 provider. Nothing
# else is required. The run uses tier 1 alone, deliberately: a failover to a weaker
# tier would still go green and hide the regression this check exists to catch.

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Which conversation(s) to run (all = every scenario, ~150 model calls)"
        type: choice
        default: all
        options:
          - all
          - max_length
          - skip_heavy
          - write_ins
          - numbers_dates
          - injection
          - out_of_order
          - multi_answer
          - probe_budget
          - broad
          - evasive
      model:
        description: "Tier-1 model id"
        type: string
        required: true
  pull_request:
    paths:
      - "backend/app/conduct/**"
      - "backend/app/llm/prompts/**"
      - "scripts/live_conversation.py"

jobs:
  live:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: elenchus
          POSTGRES_PASSWORD: elenchus
          POSTGRES_DB: elenchus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elenchus -d elenchus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://elenchus:elenchus@localhost:5432/elenchus
      LLM_TIER1_ENABLED: "true"
      LLM_TIER1_BASE_URL: ${{ vars.LLM_TIER1_BASE_URL || 'https://api.openai.com/v1' }}
      LLM_TIER1_API_KEY: ${{ secrets.LLM_TIER1_API_KEY }}
      # inputs.* exist only on workflow_dispatch. On a pull request they are empty, and an
      # empty model id disables the tier, which surfaces as a 503 mid-conversation rather
      # than as anything naming the cause. Hence the fallbacks here and on the run step.
      LLM_TIER1_MODEL: ${{ inputs.model || vars.LLM_TIER1_MODEL || 'gpt-4o-mini' }}

    steps:
      - name: Require the API key secret
        run: |
          if [ -z "$LLM_TIER1_API_KEY" ]; then
            echo "::error::No LLM_TIER1_API_KEY secret is set. Add one under" \
                 "Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Migrate and seed
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run python -m app.seed

      - name: Start the backend
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo "$!" > /tmp/uvicorn.pid
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8000/api/v1/health >/dev/null && exit 0
            sleep 1
          done
          echo "::error::backend did not become healthy in 60s"
          exit 1

      - name: Drive the conversation(s)
        # The script prints each transcript and its checks, and exits non-zero on any
        # hard-check failure, so a real regression turns this step red. The judge's
        # verdicts print in the same output and deliberately do not affect the exit code.
        #
        # A pull request gets two scenarios rather than all ten: skip_heavy is the
        # scripted survey whose checks are strongest, and evasive is prompt-generated and
        # is where both inventions found so far turned up. The judge needs the tier-1
        # credentials in its own environment, not just the backend's, because it calls the
        # provider directly.
        env:
          LLM_TIER1_BASE_URL: ${{ vars.LLM_TIER1_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_TIER1_API_KEY: ${{ secrets.LLM_TIER1_API_KEY }}
          LLM_TIER1_MODEL: ${{ inputs.model || vars.LLM_TIER1_MODEL || 'gpt-4o-mini' }}
        run: python3 scripts/live_conversation.py ${{ inputs.scenario || 'skip_heavy evasive' }}

      - name: Stop the backend
        if: always()
        run: kill "$(cat /tmp/uvicorn.pid)" 2>/dev/null || true
