name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The suite deliberately runs against a real Postgres rather than SQLite, so the
    # repository layer is exercised against the engine it ships on. Credentials match
    # the ones tests/conftest.py connects with.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: elenchus
          POSTGRES_PASSWORD: elenchus
          POSTGRES_DB: elenchus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elenchus -d elenchus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://elenchus:elenchus@localhost:5432/elenchus
      # No LLM tier is configured: the suite fakes the LLM at the client wrapper, so
      # it must pass without a key. If a test ever needs one, that is the bug.

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Migrations apply from scratch
        run: uv run alembic upgrade head

      - name: ruff
        run: uv run ruff check .

      - name: black
        run: uv run black --check app tests scripts

      - name: mypy
        run: uv run mypy app

      # The architecture rules, enforced rather than described. Layering and the
      # single-HTTP-client rule are import contracts; the query-surface, create_all
      # and prompt-version rules are guards, because they need name-level precision
      # that import-linter cannot express for an external package.
      - name: import contracts
        run: uv run lint-imports

      - name: guards
        env:
          PYTHONPATH: scripts
        run: |
          for guard in scripts/check_query_surface.py \
                       scripts/check_no_create_all.py \
                       scripts/check_prompts_versioned.py \
                       scripts/check_contrast.py \
                       scripts/check_logical_properties.py; do
            echo "--> $guard"
            uv run python "$guard" || exit 1
          done

      # tests/test_gates.py is inside this run: it plants a violation for each
      # guard and asserts a non-zero exit, so a gate that has stopped rejecting
      # anything fails the build rather than passing quietly.
      - name: pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: tsc
        run: pnpm exec tsc --noEmit

      - name: eslint
        run: pnpm exec eslint .

      - name: next build
        run: pnpm build

      - name: vitest
        run: pnpm test

      # Chromium only, and --with-deps because the runner has none of the browser
      # libraries. Cached by neither: the download is ~2 minutes and the alternative is a
      # cache key that silently serves a browser the pinned Playwright cannot drive.
      - name: install playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: playwright
        run: pnpm test:e2e
