name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The suite deliberately runs against a real Postgres rather than SQLite, so the
    # repository layer is exercised against the engine it ships on. Credentials match
    # the ones tests/conftest.py connects with.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: elenchus
          POSTGRES_PASSWORD: elenchus
          POSTGRES_DB: elenchus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elenchus -d elenchus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://elenchus:elenchus@localhost:5432/elenchus
      # No LLM tier is configured: the suite fakes the LLM at the client wrapper, so
      # it must pass without a key. If a test ever needs one, that is the bug.

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Migrations apply from scratch
        run: uv run alembic upgrade head

      - name: ruff
        run: uv run ruff check .

      - name: black
        run: uv run black --check app tests

      - name: mypy
        run: uv run mypy app

      - name: pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: tsc
        run: pnpm exec tsc --noEmit

      - name: eslint
        run: pnpm exec eslint .

      - name: next build
        run: pnpm build
